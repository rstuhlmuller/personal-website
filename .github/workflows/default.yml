name: "Default Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  check:
    permissions:
      contents: read
      checks: write
      statuses: write
    uses: stuhlmuller/workflows/.github/workflows/default.yml@277b2081f540188b9414eb7b993592b099ab9624 # main
    with:
      checkov: false
