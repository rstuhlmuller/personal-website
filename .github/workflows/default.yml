name: "Default Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  check:
    permissions:
      contents: read
      checks: write
      statuses: write
    uses: stuhlmuller/workflows/.github/workflows/default.yml@38705c434ffc5271e58b83b95399a8ea047f578d # main
    with:
      checkov: false
