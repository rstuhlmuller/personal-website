name: "Default Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  check:
    permissions:
      contents: read
      checks: write
      statuses: write
    uses: stuhlmuller/workflows/.github/workflows/default.yml@931a2f4e526c492bc8eecb08f6854626eb5eb6fc # main
    with:
      checkov: false
