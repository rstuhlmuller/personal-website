name: "Default Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  check:
    permissions:
      contents: read
      checks: write
      statuses: write
    uses: stuhlmuller/workflows/.github/workflows/default.yml@14e7ad57baa94785a31868de3e376c90f0cbfe43 # main
    with:
      checkov: false
